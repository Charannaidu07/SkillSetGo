services:
  - type: web
    name: skillsetgo
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn SkillSetGo.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://skillsetgo-1-x9e7.onrender.com,https://*.onrender.com,https://*.pythonanywhere.com,http://127.0.0.1,http://localhost"
      - key: SITE_URL
        value: "https://skillsetgo-1-x9e7.onrender.com"
      - key: DB_ENGINE
        value: "sqlite"
